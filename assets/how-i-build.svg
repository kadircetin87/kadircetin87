<svg xmlns="http://www.w3.org/2000/svg" width="600" height="176" viewBox="0 0 600 176" role="img" aria-labelledby="title desc">
  <title id="title">How I build</title>
  <desc id="desc">Sketch the layout, build one piece, then test it in the browser.</desc>
  <rect x="1" y="1" width="598" height="174" rx="14" fill="#171923" stroke="#535970"/>
  <g font-family="system-ui, sans-serif">
    <text x="26" y="41" font-size="23" font-weight="700" fill="#f8f8f2">How I build</text>
    <path d="M37 83 H425" fill="none" stroke="#535970" stroke-width="2"/>
    <g stroke="#171923" stroke-width="5">
      <circle cx="37" cy="83" r="10" fill="#8be9fd"/>
      <circle cx="231" cy="83" r="10" fill="#bd93f9"/>
      <circle cx="425" cy="83" r="10" fill="#50fa7b"/>
    </g>
    <g font-size="20" font-weight="650" fill="#f8f8f2">
      <text x="26" y="122">Sketch</text><text x="220" y="122">Build</text><text x="414" y="122">Test</text>
    </g>
    <g font-size="15" fill="#ced1df">
      <text x="26" y="148">Map the layout.</text><text x="220" y="148">Make one piece.</text><text x="414" y="148">Try it in the browser.</text>
    </g>
  </g>
</svg>